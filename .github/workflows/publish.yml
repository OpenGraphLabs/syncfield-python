name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: src/syncfield/viewer/frontend/yarn.lock

      - name: Build viewer frontend
        working-directory: src/syncfield/viewer/frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install \
            "pytest>=8.4.2" \
            "pytest-aiohttp>=1.1.0" \
            "pytest-asyncio>=1.2.0" \
            "pytest-mock>=3.12.0" \
            "pytest-timeout>=2.4.0" \
            "pytest-xdist>=3.6.0"

      - name: Run tests
        run: pytest -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node (for viewer frontend)
        uses: actions/setup-node@v6
        with:
          # camera-controls (transitive dep via @react-three/drei) requires
          # Node >= 22. yarn enforces engines.node strictly — npm only warned,
          # which is how the dep slipped past our previous Node 20 runs.
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: src/syncfield/viewer/frontend/yarn.lock

      - name: Build viewer frontend
        working-directory: src/syncfield/viewer/frontend
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Verify wheel contents and installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'import importlib.metadata, tomllib; expected = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert importlib.metadata.version("syncfield") == expected'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
